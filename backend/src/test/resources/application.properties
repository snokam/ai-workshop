# Tests boot the real context, and DocumentFiles empties its directory on startup (ADR 0004). Sharing
# the directory with a running application therefore means `./mvnw test` deletes the files of whatever
# is running — every preview breaks and the Case Chat can no longer read a document, silently, in the
# middle of a demo. So the suite gets its own.
aiworkshop.documents.directory=${java.io.tmpdir}/aiworkshop-documents-test

# This file shadows the main one rather than adding to it, so anything the context needs to start
# has to be here too. The model is built at startup and validates its own settings, but nothing in
# the suite calls it — no request is ever sent, and no credentials are read.
vertex-ai.project=workshop-tests
vertex-ai.location=europe-west4
vertex-ai.model-name=gemini-2.5-flash
