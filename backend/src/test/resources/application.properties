# Tests boot the real context, and DocumentFiles empties its directory on startup. Sharing
# the directory with a running application therefore means `./mvnw test` deletes the files of whatever
# is running — every preview breaks and the Claim Chat can no longer read a document, silently, in the
# middle of a demo. So the suite gets its own.
aiworkshop.documents.directory=${java.io.tmpdir}/aiworkshop-documents-test

# This file shadows the main one rather than adding to it, so anything the context needs to start
# has to be here too. The model is built at startup and validates its own settings, but almost
# nothing in the suite calls it — no request is sent and no credentials are read, so a made-up
# project is enough and the suite runs offline.
#
# Except task 4. The evaluations are the one place that does call the model, and they are
# @SpringBootTest like everything else, so they read this file and would send their requests to a
# project that does not exist. So this falls back the same way the main file does — to the literal
# "unspecified", which VertexAiProperties.projectId() recognises as nobody having said, and answers
# by reading the project out of the credentials already on the machine. A laptop with no credentials
# still starts and still runs the suite offline; one that has signed in to Claude Code runs the
# evaluations against the right project without being told anything.
vertex-ai.project=${GOOGLE_CLOUD_PROJECT:unspecified}
vertex-ai.location=${GOOGLE_CLOUD_LOCATION:europe-west4}
vertex-ai.model-name=${GOOGLE_CLOUD_MODEL:gemini-2.5-flash}
vertex-ai.temperature=0.2
# Must match the main file, and for the same reason. The default if this is left out is 1024, which
# a reasoning model spends on thinking before any JSON appears — so the reply arrives truncated and
# surfaces as "the reply could not be read as an analysis". That looks exactly like a guardrail
# catching something, which is how it went unnoticed: the attack-set evaluation scored a confident
# five out of five while every reply was in fact unusable.
vertex-ai.max-output-tokens=16384
