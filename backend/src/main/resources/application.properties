spring.application.name=aiworkshop

# Which provider backs the ChatModel bean. Change this line to switch, or
# override per-run with the AI_PROVIDER env var. One of: vertex | foundry
#
# Vertex is the default because it is what the room uses. A participant who has
# signed in to Claude Code already has the credentials this needs, so the
# application finds them without being told anything. Foundry is the Snokam
# staff path and has to be asked for.
aiworkshop.model.provider=${AI_PROVIDER:vertex}

# --- Vertex AI (Gemini) -------------------------------------------------------
# Auth is Application Default Credentials, not an API key. Run once locally:
#   gcloud auth application-default login
#   gcloud auth application-default set-quota-project ${GOOGLE_CLOUD_PROJECT}
vertex-ai.project=${GOOGLE_CLOUD_PROJECT:unspecified}
vertex-ai.location=${GOOGLE_CLOUD_LOCATION:europe-west4}
vertex-ai.model-name=${GOOGLE_CLOUD_MODEL:gemini-2.5-flash}

# A second, smaller model. Task 5 decides which of its two agents each job needs: measured on the
# status line, flash-lite answered in a third of the time for three quarters of the tokens — and
# ignored "one short sentence", which is the half of the trade you only see by looking.
vertex-ai.cheaper-model-name=${GOOGLE_CLOUD_CHEAPER_MODEL:gemini-2.5-flash-lite}
vertex-ai.temperature=0.2
# Room for structured output, set high on purpose. Reasoning models spend part of this budget on
# thinking before any JSON appears, and running out mid-object surfaces as an unparseable reply
# rather than a clean error — the worst possible failure to debug in front of an audience.
vertex-ai.max-output-tokens=16384
vertex-ai.max-retries=3
vertex-ai.log-requests=false
vertex-ai.log-responses=false

# --- Azure AI Foundry ---------------------------------------------------------
# endpoint: the OpenAI-compatible base URL, ending in /openai/v1
# deployment-name: the name you gave the deployment, which is NOT the model name
# Keep the key out of git: export AZURE_OPENAI_API_KEY=...
foundry.endpoint=${AZURE_OPENAI_ENDPOINT:https://ai-wshp-p.services.ai.azure.com/openai/v1}
foundry.api-key=${AZURE_OPENAI_API_KEY:}
foundry.deployment-name=${AZURE_OPENAI_DEPLOYMENT:gpt-5.6-luna}
foundry.max-completion-tokens=16384
# A large scan through a reasoning model can sit well past the default. Better a slow demo than a
# timeout on stage.
foundry.timeout=180s
foundry.max-retries=3
# Uncomment only if the deployment accepts a custom temperature; several newer
# models reject anything but the default with a 400.
#foundry.temperature=0.2
# Flip these on to see the raw request/response during the workshop
foundry.log-requests=false
foundry.log-responses=false

# --- Uploads ------------------------------------------------------------------
# Where the uploaded bytes are kept so the case chat's reader agent can look at a
# file again. Emptied at startup: the records pointing at these files
# are in memory and do not survive a restart.
aiworkshop.documents.directory=${DOCUMENT_DIR:${java.io.tmpdir}/aiworkshop-documents}

# Spring's 1MB default rejects exactly the files this demo is built around: a phone
# photo of a document is routinely 5-10 MB, a scanned multi-page PDF more. Set well
# above anything anyone will drag in on the day.
#
# Note where the real ceiling is: the model providers cap inline file data at roughly
# 20MB per request, so a file larger than that fails at the provider, not here. These
# limits exist so Spring is never the thing that says no.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
# Without this, Tomcat stops reading a body it has decided to reject and the browser
# sees a connection reset instead of the error message.
server.tomcat.max-swallow-size=-1

logging.level.dev.langchain4j=INFO
logging.level.com.example.aiworkshop=INFO
